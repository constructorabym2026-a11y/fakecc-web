<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Consultoría, Constructora e Inversiones FAKECC S.A.C. — obras civiles, viales y urbanas para municipalidades de Lima Norte. Ejecutor y consultor de obras inscrito en el RNP.">
<title>FAKECC S.A.C. | Obras civiles, viales y urbanas en Lima Norte</title>
<link rel="canonical" href="https://fakeccconstructora.com/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="FAKECC S.A.C.">
<meta property="og:title" content="FAKECC S.A.C. | Obras civiles, viales y urbanas en Lima Norte">
<meta property="og:description" content="Consultoría, Constructora e Inversiones FAKECC S.A.C. — obras civiles, viales y urbanas para municipalidades de Lima Norte. Ejecutor y consultor de obras inscrito en el RNP.">
<meta property="og:url" content="https://fakeccconstructora.com/">
<meta property="og:image" content="https://fakeccconstructora.com/images/presentacion_1.jpg">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" type="image/svg+xml" href="images/favicon-fakecc.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<a class="skip-link" href="#main">Ir al contenido</a>
<header id="siteHeader"></header>

<main id="main" class="page">

  <!-- 1. PORTADA: la arma js/main.js desde CONFIG.hero -->
  <section class="hero" id="hero" aria-label="Presentación"></section>

  <!-- 1b. INDICADORES: los arma js/main.js desde CONFIG.stats -->
  <section class="stats" aria-label="La empresa en cifras">
    <div class="wrap">
      <div class="stats__grid" id="statsGrid"></div>
    </div>
  </section>

  <!-- 2. ESPECIALIDADES: la arma js/main.js desde CONFIG.rubros.
       data-encabezado="h2" porque la página ya tiene su h1 en el hero. -->
  <section class="especialidades" id="especialidades" data-encabezado="h2" aria-label="Especialidades"></section>

  <!-- 3. NOSOTROS: dos franjas seguidas -->
  <section id="nosotros" aria-labelledby="nosotrosTitulo">

    <!-- 3a. Quiénes somos -->
    <div class="block">
      <div class="wrap split">
        <div class="split__text reveal">
          <p class="eyebrow">Nosotros</p>
          <h2 class="block__title" id="nosotrosTitulo">Una constructora de Lima Norte, trabajando en Lima Norte</h2>
          <div class="roadline"></div>
          <!-- El primer párrafo sale de CONFIG.institucional.historia (js/main.js) -->
          <p style="margin-top:1.5rem" id="historiaTexto"></p>
          <p>Nuestras obras están en Los Olivos y su zona de influencia en Lima Norte: pistas, veredas, sardineles, parques, escaleras y muros de contención en asentamientos humanos y urbanizaciones.</p>
          <a class="btn btn--outline" style="margin-top:1.5rem" href="nosotros.html">Conocer la empresa</a>
        </div>

        <div class="split__media reveal">
          <img src="images/equipo_1.jpg" alt="Equipo de FAKECC en obra" loading="lazy">
        </div>
      </div>
    </div>

  </section>

  <!-- 4. PROYECTOS: la arma js/main.js desde CONFIG.destacadas -->
  <section class="strip" id="obrasDestacadas" aria-label="Nuestros proyectos"></section>

  <!-- 5. CERTIFICACIONES: solo los sellos -->
  <section class="isoband">
    <div class="wrap isoband__row reveal" id="isoBand"></div>
  </section>

</main>

<footer id="siteFooter"></footer>

<script src="js/config.js"></script>
<script src="js/components.js"></script>
<script src="js/main.js"></script>
<script src="js/proyectos.js"></script>
<script src="js/animations.js"></script>
</body>
</html>
